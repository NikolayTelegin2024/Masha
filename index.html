<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Для тебя ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat&display=swap" rel="stylesheet" />
    <style>
        /* --- Общие стили --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #3a2c1b;
            background-image: radial-gradient(circle at 20% 30%, #5a4a33, #1f160e);
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
        }

        /* --- Свиток --- */
        .scroll {
            position: relative;
            width: 100%;
            max-width: 720px;
            background: #f7efe2;
            background-image:
                repeating-linear-gradient(0deg,
                    transparent,
                    transparent 29px,
                    rgba(200, 180, 150, 0.15) 30px,
                    transparent 31px);
            padding: 60px 50px 50px;
            border-radius: 8px 8px 30px 30px;
            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.7),
                inset 0 0 0 2px #e6d5bb,
                inset 0 0 0 6px #dac8ac;
            transition: transform 0.8s ease, opacity 0.8s ease;
            z-index: 2;
        }

        .scroll::before,
        .scroll::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 20px;
            background: #e6d5bb;
            background-image:
                repeating-linear-gradient(90deg,
                    #dac8ac 0px, #dac8ac 8px,
                    transparent 8px, transparent 16px);
            opacity: 0.6;
        }
        .scroll::before {
            top: -10px;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }
        .scroll::after {
            bottom: -10px;
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
        }

        .title {
            text-align: center;
            font-family: 'Caveat', cursive;
            font-size: 2.6rem;
            color: #5a3e2b;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 rgba(200, 150, 100, 0.2);
        }

        /* --- Печатный текст --- */
        .typewriter {
            font-family: 'Caveat', cursive;
            font-size: 2.0rem;
            line-height: 1.8;
            color: #3d2b1b;
            min-height: 260px;
            white-space: pre-wrap;
            word-break: break-word;
            padding: 10px 0;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 2.2rem;
            background: #8b3f2a;
            margin-left: 4px;
            vertical-align: text-bottom;
            animation: blink 0.9s step-end infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* --- Котик --- */
        .kitty {
            text-align: right;
            font-size: 4.5rem;
            line-height: 1;
            margin-top: 10px;
            animation: bounce 1.8s ease-in-out infinite;
            user-select: none;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.15));
        }

        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0) rotate(-2deg);
            }
            50% {
                transform: translateY(-22px) rotate(2deg);
            }
        }

        /* --- Кнопка --- */
        .seal-btn {
            display: block;
            margin: 30px auto 0;
            padding: 16px 42px;
            background: #b23b2a;
            border: none;
            border-radius: 60px;
            font-family: 'Caveat', cursive;
            font-size: 2.0rem;
            color: #fef6e8;
            box-shadow: 0 8px 0 #6e2419, 0 10px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.08s linear;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.2);
        }

        .seal-btn:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 #6e2419;
        }

        /* --- Секретный блок - теперь это СЛАЙДШОУ --- */
        .slideshow-container {
            margin-top: 35px;
            display: none;
            /* скрыт до нажатия */
            background: rgba(30, 20, 12, 0.7);
            border-radius: 30px;
            padding: 15px;
            backdrop-filter: blur(6px);
            border: 3px solid #b28b6f;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }

        .slideshow-container.active {
            display: block;
            animation: fadeSlide 0.8s ease;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .slideshow-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 75%;
            /* пропорции 4:3 */
            height: 0;
            overflow: hidden;
            border-radius: 20px;
            background: #000;
        }

        .slideshow-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease;
            border-radius: 20px;
        }

        .slideshow-wrapper img.active {
            opacity: 1;
        }

        /* --- Аудиоплеер (минималистичный) --- */
        .audio-player {
            text-align: center;
            margin-top: 15px;
            color: #f7efe2;
            font-family: 'Caveat', cursive;
            font-size: 1.4rem;
        }

        .audio-player audio {
            width: 100%;
            max-width: 300px;
            border-radius: 40px;
            background: #3a2c1b;
            height: 40px;
        }

        /* --- Анимация сворачивания свитка --- */
        .scroll.rolled {
            transform: scaleY(0.02) scaleX(0.9);
            opacity: 0;
            pointer-events: none;
        }

        /* --- Адаптация --- */
        @media (max-width: 500px) {
            .scroll {
                padding: 40px 25px 30px;
            }
            .typewriter {
                font-size: 1.6rem;
                min-height: 200px;
            }
            .title {
                font-size: 2.0rem;
            }
            .kitty {
                font-size: 3.2rem;
            }
            .seal-btn {
                font-size: 1.6rem;
                padding: 14px 28px;
            }
        }
    </style>
</head>
<body>

    <div class="scroll" id="scroll">

        <div class="title">✧ Старинное письмо ✧</div>

        <div class="typewriter" id="textArea">
            <span class="cursor"></span>
        </div>

        <div class="kitty">🐾 🐈</div>

        <button class="seal-btn" id="sealBtn">🔮 Сломать печать</button>

        <!-- === НОВЫЙ БЛОК: Слайдшоу + Музыка === -->
        <div class="slideshow-container" id="slideshowBlock">
            <div class="slideshow-wrapper" id="slideshowWrapper">
                <!-- Сюда JS вставит фотографии -->
            </div>
            <div class="audio-player">
                🎵 Наш саундтрек<br />
                <audio id="bgMusic" controls>
                    <source src="music.mp3" type="audio/mpeg" />
                    Твой браузер не поддерживает аудио.
                </audio>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        //  ТЕКСТ ПИСЬМА (ЗАМЕНИ НА СВОЙ)
        // ============================================================
        const fullText = "Я мог бы написать это сотней способов,
        но пусть этот свиток останется с тобой.

        Ты делаешь меня счастливие каждый день, с тобой я забываю обо всех проблемах, моя жизнь рядом с тобой всегда — ярче.
        Спасибо, что ты есть.

        Готова ли ты со мной встречаться, еще минимум год?)

        Твой навсегда, Коля";

        // ============================================================
        //  ТВОИ ФОТОГРАФИИ (ЗАМЕНИ ССЫЛКИ!)
        // ============================================================
        const photos = [
            'photo1.jpg',   // <- сюда вставь путь к первому фото
            'photo2.jpg',   // <- сюда вставь путь к второму фото
            'photo3.jpg',   // <- и так далее
            'photo4.jpg',
            'photo5.jpg'
        ];

        // ============================================================
        //  НАСТРОЙКИ
        // ============================================================
        const typeSpeed = 45;
        const slideInterval = 3500; // 3.5 секунды на фото

        const element = document.getElementById('textArea');
        const scroll = document.getElementById('scroll');
        const sealBtn = document.getElementById('sealBtn');
        const slideshowBlock = document.getElementById('slideshowBlock');
        const slideshowWrapper = document.getElementById('slideshowWrapper');
        const bgMusic = document.getElementById('bgMusic');

        let charIndex = 0;
        let currentSlide = 0;
        let slideTimer = null;

        // --- Печать текста ---
        function typeText() {
            if (charIndex < fullText.length) {
                const displayed = fullText.substring(0, charIndex + 1);
                element.innerHTML = displayed + `<span class="cursor"></span>`;
                charIndex++;
                setTimeout(typeText, typeSpeed);
            } else {
                element.innerHTML = fullText;
            }
        }

        // --- Загружаем фото в слайдер ---
        function initSlideshow() {
            slideshowWrapper.innerHTML = '';
            if (photos.length === 0) {
                slideshowWrapper.innerHTML =
                    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.5rem;font-family:Caveat;">Добавь фото в массив photos</div>';
                return;
            }

            photos.forEach((src, index) => {
                const img = document.createElement('img');
                img.src = src;
                img.alt = `Фото ${index + 1}`;
                if (index === 0) img.classList.add('active');
                img.onerror = function() {
                    this.alt = 'Фото не найдено';
                    this.style.objectFit = 'contain';
                    this.style.padding = '20px';
                };
                slideshowWrapper.appendChild(img);
            });

            // Запускаем переключение
            startSlideshow();
        }

        function startSlideshow() {
            if (slideTimer) clearInterval(slideTimer);
            const images = slideshowWrapper.querySelectorAll('img');
            if (images.length < 2) return;

            slideTimer = setInterval(() => {
                images.forEach(img => img.classList.remove('active'));
                currentSlide = (currentSlide + 1) % images.length;
                images[currentSlide].classList.add('active');
            }, slideInterval);
        }

        // --- Обработчик кнопки ---
        sealBtn.addEventListener('click', function() {
            // Показываем слайдшоу
            slideshowBlock.classList.add('active');

            // Пытаемся запустить музыку (автоплей часто блокируется, но пользователь уже кликнул)
            bgMusic.play().catch(() => {
                console.log('Автозапуск музыки заблокирован, но плеер доступен');
            });

            // Сворачиваем свиток
            scroll.classList.add('rolled');
            setTimeout(() => {
                scroll.classList.remove('rolled');
                scroll.style.transform = 'scale(0.98)';
                scroll.style.boxShadow = '0 8px 25px rgba(0,0,0,0.5), inset 0 0 0 2px #e6d5bb';
                sealBtn.style.display = 'none';
                document.querySelector('.title').textContent = '✧ Печать сломана ✧';
            }, 900);

            // Инициализируем слайдшоу (если ещё не)
            if (slideshowWrapper.children.length === 0) {
                initSlideshow();
            } else {
                startSlideshow();
            }
        });

        // --- Старт печати ---
        setTimeout(typeText, 500);

        // Если фото уже загружены — проинициализировать, но скрыто
        // Сделаем это после загрузки страницы
        window.addEventListener('load', function() {
            // Подготовим слайдер, но не показываем
            initSlideshow();
            // Остановим переключение, пока не нажата кнопка
            if (slideTimer) {
                clearInterval(slideTimer);
                slideTimer = null;
            }
        });

        console.log('❤️ Сайт с слайдшоу готов!');
    </script>
</body>
</html>
